---
- hosts: localhost
  gather_facts: false
  vars:
    awx_admin: "admin"
    awx_password: '2G>P>6r*Pk]j_6m'

    users_to_add:
      - username: "john_doe"
        first_name: "John"
        last_name: "Doe"
        email: "john.doe@alienware.loc"
        is_superuser: false

      - username: "jane_smith"
        first_name: "Jane"
        last_name: "Smith"
        email: "jane.smith@alienware.loc"
        is_superuser: true

      - username: "andrei_popescu"
        first_name: "Andrei"
        last_name: "Popescu"
        email: "andrei.popescu@alienware.loc"
        is_superuser: false

  tasks:
    - name: "POST - Create multiple users sequentially"
      my_api:
        base_url: "https://tower.alienware.loc"
        api_version: "api/v2"
        endpoint: "/users/"
        method: POST
        username: "{{ awx_admin }}"
        password: "{{ awx_password }}"
        validate_certs: false
        data:
          username: "{{ item.username }}"
          password: "InitialSecurePassword2026!"
          first_name: "{{ item.first_name }}"
          last_name: "{{ item.last_name }}"
          email: "{{ item.email }}"
          is_superuser: "{{ item.is_superuser }}"
          is_system_auditor: false
      loop: "{{ users_to_add }}"
      register: multi_create_responses

    - name: Print summary of successfully created users
      debug:
        msg: "Successfully created user '{{ item.json.username }}' with ID {{ item.json.id }} (HTTP Status: {{ item.status }})"
      loop: "{{ multi_create_responses.results }}"
      when: not item.failed
